<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>เพื่อนใหม่ PSRU | แนะนำตัว</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* พื้นหลังลายจุดน่ารัก */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 20%),
                              radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 25%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 550px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* การ์ดหลัก */
        .card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 60px 30px 60px 30px;
            padding: 40px 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.3) inset;
            transition: transform 0.3s ease;
        }

        /* หัวข้อ */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 80px;
            height: 80px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .logo-icon i {
            font-size: 3rem;
            color: white;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header p {
            color: #888;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        /* ฟอร์ม */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group label i {
            color: #764ba2;
            margin-right: 8px;
            width: 22px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px 18px;
            font-size: 1rem;
            border: 2px solid #e8e8e8;
            border-radius: 25px;
            font-family: 'Prompt', sans-serif;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #764ba2;
            background: white;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.2);
        }

        /* ปุ่มส่ง */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(118, 75, 162, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit i {
            margin-right: 10px;
        }

        /* ส่วนพัฒนาโดย */
        .developer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e0d0ff;
            color: #888;
            font-size: 0.9rem;
        }

        .developer span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            font-size: 1rem;
        }

        .developer i {
            color: #ff6b6b;
            margin: 0 3px;
        }

        /* สติกเกอร์น่ารัก */
        .sticker {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .card {
                padding: 30px 25px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .logo-icon {
                width: 65px;
                height: 65px;
            }
            .logo-icon i {
                font-size: 2.3rem;
            }
            .form-group input,
            .form-group select {
                padding: 13px 16px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <div class="card">
            <!-- สติกเกอร์ต้อนรับ -->
            <div class="sticker">
                🎓✨🦄
            </div>

            <!-- หัวข้อ -->
            <div class="header">
                <div class="logo-icon">
                    <i class="fas fa-user-friends"></i>
                </div>
                <h1>เพื่อนใหม่ PSRU</h1>
                <p>มาแนะนำตัวกันเถอะ ~ ทำความรู้จักกันนะ!</p>
            </div>

            <!-- ฟอร์มแนะนำตัว -->
            <form id="introForm" onsubmit="sendToEmail(event)">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> ชื่อเล่น</label>
                    <input type="text" id="nickname" placeholder="เช่น มายด์, เฟิร์ส, จูน" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-calendar-alt"></i> อายุ</label>
                    <input type="number" id="age" placeholder="อายุเท่าไหร่" min="15" max="60" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-university"></i> คณะ</label>
                    <select id="faculty" required>
                        <option value="" disabled selected>-- เลือกคณะ --</option>
                        <option value="คณะครุศาสตร์">คณะครุศาสตร์</option>
                        <option value="คณะมนุษยศาสตร์">คณะมนุษยศาสตร์</option>
                        <option value="คณะวิทยาศาสตร์และเทคโนโลยี">คณะวิทยาศาสตร์และเทคโนโลยี</option>
                        <option value="คณะวิทยาการจัดการ">คณะวิทยาการจัดการ</option>
                        <option value="คณะเทคโนโลยีการเกษตร">คณะเทคโนโลยีการเกษตร</option>
                        <option value="คณะเทคโนโลยีอุตสาหกรรม">คณะเทคโนโลยีอุตสาหกรรม</option>
                        <option value="คณะนิติศาสตร์">คณะนิติศาสตร์</option>
                        <option value="คณะพยาบาลศาสตร์">คณะพยาบาลศาสตร์</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> ส่งคำแนะนำตัว
                </button>
            </form>

            <!-- พัฒนาโดย -->
            <div class="developer">
                <i class="fas fa-crown"></i> พัฒนาโดย 
                <span>ตะวัน</span> เองจ้าาา 
                <i class="fas fa-heart"></i>
                <div style="font-size: 0.8rem; margin-top: 8px;">
                    <i class="fab fa-instagram"></i> ttttt___998on
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendToEmail(event) {
            event.preventDefault(); // ป้องกันการรีเฟรชหน้า

            // รับค่าจากฟอร์ม
            const nickname = document.getElementById('nickname').value.trim();
            const age = document.getElementById('age').value.trim();
            const faculty = document.getElementById('faculty').value;

            // ตรวจสอบความถูกต้อง
            if (!nickname) {
                alert('กรุณากรอกชื่อเล่นของเธอด้วยนะเบ้บ 🥺');
                return;
            }
            if (!age || age < 15 || age > 60) {
                alert('กรุณากรอกอายุให้ถูกต้อง (15-60 ปี) 🎂');
                return;
            }
            if (!faculty) {
                alert('เลือกคณะให้เค้าหน่อยเบ้บ 🏫');
                return;
            }

            // วันที่และเวลา
            const now = new Date();
            const thaiDate = now.toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });

            // สร้างข้อความอีเมล
            const subject = `📌 เพื่อนใหม่ PSRU - ${nickname} แนะนำตัว`;
            
            const body = `
═══════════════════════════════════
          🌟 เพื่อนใหม่ PSRU 🌟
═══════════════════════════════════

👤 ชื่อเล่น: ${nickname}
🎂 อายุ: ${age} ปี
🏛️ คณะ: ${faculty}

───────────────────────────────
📅 ส่งเมื่อ: ${thaiDate}
───────────────────────────────

💬 ข้อความจาก ${nickname}:
"ยินดีที่ได้รู้จักทุกคนนะ/ครับ 
 ไว้เจอกันตอน มอเปิดนะค้าบบ 💖"

═══════════════════════════════════
   ขอบคุณที่แนะนำตัวนะ
   เดี๋ยวเจอกันที่มอออ
═══════════════════════════════════
            `.trim();

            // สร้างลิงก์ mailto
            const mailtoLink = `mailto:mlllsdjsmsms@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            
            // เปิดหน้าต่างอีเมล
            window.location.href = mailtoLink;

            // แจ้งเตือนผู้ใช้
            setTimeout(() => {
                alert('✨ เปิดหน้าต่างอีเมลแล้ว ✨\n\nกรุณากดส่งอีกครั้งในหน้าต่างอีเมลนะคั้บเบ้บ\nแล้วเราจะได้เป็นเพื่อนใหม่กัน 💕');
            }, 500);

            // รีเซ็ตฟอร์ม (ไม่จำเป็น แต่ทำให้ดูเรียบร้อย)
            // document.getElementById('introForm').reset();
        }
    </script>
</body>
</html>
