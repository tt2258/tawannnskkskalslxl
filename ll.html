<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>แนะนำตัวให้ตะวันรู้จักหน่อยย | เพื่อนใหม่ PSRU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* พื้นหลังเรียบง่าย ไม่มีเอฟเฟกต์หนัก */
        .container {
            max-width: 1200px;
            width: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        /* การ์ด */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px 20px 40px 20px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        /* หัวข้อ */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #ff8c5a, #ff4757);
            width: 75px;
            height: 75px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
        }

        .logo-icon i {
            font-size: 2.8rem;
            color: white;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e66;
            letter-spacing: 1px;
        }

        .header p {
            color: #7f8c8d;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        /* ฟอร์ม */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c3e66;
            margin-bottom: 8px;
        }

        .form-group label i {
            color: #ff4757;
            margin-right: 8px;
            width: 22px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff8c5a;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 140, 90, 0.1);
        }

        /* ปุ่มส่ง */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff8c5a, #ff4757);
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        .btn-submit:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.3);
        }

        .btn-submit i {
            margin-right: 10px;
        }

        /* ส่วนพัฒนาโดย */
        .developer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e0e0e0;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .developer span {
            color: #ff4757;
            font-weight: 600;
            font-size: 1rem;
        }

        .developer i {
            color: #ff4757;
            margin: 0 3px;
        }

        .ig-link {
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .ig-link a {
            color: #e1306c;
            text-decoration: none;
        }

        /* QR Code Card */
        .qrcard {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px 20px 40px 20px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .qrcard h3 {
            font-size: 1.6rem;
            color: #2c3e66;
            margin-bottom: 12px;
        }

        .qrcard p {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        #qrcode img, #qrcode canvas {
            border-radius: 20px;
            padding: 12px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .qr-note {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #95a5a6;
        }

        .qr-note i {
            color: #ff4757;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .card, .qrcard {
                padding: 25px 20px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .logo-icon {
                width: 60px;
                height: 60px;
            }
            .logo-icon i {
                font-size: 2.2rem;
            }
            .btn-submit {
                font-size: 1rem;
                padding: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ฟอร์มแนะนำตัว -->
        <div class="card">
            <div class="header">
                <div class="logo-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>แนะนำตัวให้ตะวันรู้จักหน่อยย</h1>
                <p>มาเป็นเพื่อนใหม่กันเถอะครับ !</p>
            </div>

            <form id="introForm" onsubmit="sendToEmail(event)">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> ชื่อเล่น</label>
                    <input type="text" id="nickname" placeholder="เช่น มาร์ค, ไททัน, เฟิร์ส" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-calendar-alt"></i> อายุ</label>
                    <input type="number" id="age" placeholder="อายุเท่าไหร่ครับ" min="15" max="60" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-university"></i> คณะ</label>
                    <input type="text" id="faculty" placeholder="เช่น คณะวิทยาการจัดการ, คณะครุศาสตร์" required autocomplete="off">
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> ส่งคำแนะนำตัว
                </button>
            </form>

            <div class="developer">
                <i class="fas fa-crown"></i> พัฒนาโดย 
                <span>ตะวัน</span> เองจ้าาา 
                <i class="fas fa-heart"></i>
                <div class="ig-link">
                    <i class="fab fa-instagram"></i> <a href="https://instagram.com/ttttt___998on" target="_blank">ttttt___998on</a>
                </div>
            </div>
        </div>

        <!-- QR Code Card -->
        <div class="qrcard">
            <h3><i class="fas fa-qrcode"></i> สแกนเลย!</h3>
            <p>สแกน QR Code นี้<br>เพื่อเปิดเว็บแนะนำตัวได้เลยครับ</p>
            <div id="qrcode"></div>
            <div class="qr-note">
                <i class="fas fa-mobile-alt"></i> ใช้กล้องมือถือสแกน หรือแชร์ให้เพื่อนครับ
            </div>
        </div>
    </div>

    <script>
        // สร้าง QR Code
        function generateQRCode() {
            const currentUrl = window.location.href;
            const qrcodeContainer = document.getElementById('qrcode');
            
            if (qrcodeContainer) {
                qrcodeContainer.innerHTML = '';
                
                try {
                    new QRCode(qrcodeContainer, {
                        text: currentUrl,
                        width: 180,
                        height: 180,
                        colorDark: "#2c3e66",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch(e) {
                    console.log("QR Code error:", e);
                }
            }
        }

        // ฟังก์ชันส่งอีเมล
        function sendToEmail(event) {
            event.preventDefault();

            const nickname = document.getElementById('nickname').value.trim();
            const age = document.getElementById('age').value.trim();
            const faculty = document.getElementById('faculty').value.trim();

            if (!nickname) {
                alert('กรุณากรอกชื่อเล่นของคุณด้วยครับ');
                return;
            }
            if (!age || age < 15 || age > 60) {
                alert('กรุณากรอกอายุให้ถูกต้องนะครับ (15-60 ปี)');
                return;
            }
            if (!faculty) {
                alert('กรุณากรอกคณะของคุณด้วยครับ');
                return;
            }

            const now = new Date();
            const thaiDate = now.toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });

            const subject = `📌 แนะนำตัวให้ตะวันรู้จัก - ${nickname}`;
            
            const body = `
═══════════════════════════════════
          สวัสดีครับตะวัน 👋
═══════════════════════════════════

👤 ชื่อเล่น: ${nickname}
🎂 อายุ: ${age} ปี
🏛️ คณะ: ${faculty}

───────────────────────────────
📅 ส่งเมื่อ: ${thaiDate}
───────────────────────────────

💬 ข้อความจาก ${nickname}:
"หวัดดีครับตะวัน ยินดีที่ได้รู้จัก
 หวังว่าจะได้เป็นเพื่อนกันนะครับ"

═══════════════════════════════════
   ขอบคุณที่แนะนำตัวนะครับ 
═══════════════════════════════════
            `.trim();

            const mailtoLink = `mailto:mlllsdjsmsms@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoLink;

            setTimeout(() => {
                alert('✨ เปิดหน้าต่างอีเมลแล้วครับ ✨\n\nกรุณากดส่งอีกครั้งในหน้าต่างอีเมลนะครับ');
            }, 300);
        }

        // โหลด QR Code เมื่อหน้าเว็บพร้อม
        window.onload = function() {
            generateQRCode();
        };
    </script>
</body>
</html>
